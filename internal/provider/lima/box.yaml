# Lima template for a local Tiffin box: Ubuntu 26.04 LTS, 2 vCPU / 4 GiB,
# 20 GiB root (ext4) plus an XFS data disk at /var/lib/tiffin.
# (Kept in step with e2e/lima/tiffin-box.yaml.)
#
# Images: the rolling resolute (26.04) `release/` build is listed first (no digest, it
# moves; Lima verifies it over HTTPS). It is far faster to download than the
# dated release-YYYYMMDD directories, which Ubuntu's mirror serves at ~1 KB/s
# when cold. Lima's own template:_images/ubuntu-26.04 follows as the fallback;
# it carries sha256 digests for the dated builds (arm64 + amd64).
#
# The additional disk name below is a placeholder: `tiffin up` creates the
# disk and overrides this entry with `limactl create --set`.
minimumLimaVersion: 2.0.0

images:
- location: https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-arm64.img
  arch: aarch64
  variant: server
- location: https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img
  arch: x86_64
  variant: server

base:
- template:_images/ubuntu-26.04

# vz is the Apple Virtualization backend (macOS). The harness overrides this
# on other hosts.
vmType: vz

cpus: 2
memory: 4GiB
disk: 20GiB

# No host mounts at all (_default/mounts is intentionally not inherited).
mounts: []

additionalDisks:
- name: tiffin-e2e-data
  format: true
  fsType: xfs

# No containerd: Tiffin installs its own runtime.
containerd:
  system: false
  user: false

# Only the box's HTTPS port reaches the Mac, and only on 127.0.0.1. macOS
# lets unprivileged processes bind ports below 1024 only on 0.0.0.0, which
# would expose the box to the LAN, so the box serves HTTPS on 8443 instead.
# Everything else the box runs (Postgres, Valkey, ...) stays inside it.
portForwards:
- guestPort: 8443
  hostIP: 127.0.0.1
# Everything else stays inside the box, whether it binds 127.0.0.1 or 0.0.0.0.
- guestIP: 127.0.0.1
  guestPortRange: [1, 65535]
  proto: any
  ignore: true
- guestIP: 0.0.0.0
  proto: any
  ignore: true

# Lima mounts an additional disk at /mnt/lima-<disk> and has no per-disk
# mountPoint setting (checked on Lima 2.2). We mount the same filesystem at
# /var/lib/tiffin from fstab by its label (lima-<disk>), so it is there at
# boot before any service starts.
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v mkfs.xfs >/dev/null || { apt-get update -y && apt-get install -y xfsprogs; }
    # Mount the XFS data disk at /var/lib/tiffin by label from fstab, so
    # systemd mounts it at boot before anything (tiffin.service declares
    # RequiresMountsFor). A bind of Lima's /mnt/lima-* mount would race it.
    dev="$(blkid -t TYPE=xfs -o device | head -n1)"
    [ -n "$dev" ] || { echo "no XFS data disk found" >&2; exit 1; }
    label="$(blkid -s LABEL -o value "$dev")"
    mkdir -p /var/lib/tiffin
    sed -i '\| /var/lib/tiffin none bind |d' /etc/fstab
    grep -q "^LABEL=$label /var/lib/tiffin " /etc/fstab || \
      echo "LABEL=$label /var/lib/tiffin xfs defaults,nofail,x-systemd.device-timeout=60s 0 2" >> /etc/fstab
    systemctl daemon-reload
    mountpoint -q /var/lib/tiffin || mount /var/lib/tiffin

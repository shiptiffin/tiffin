[project]
name = "notes-api"
version = "0.1.0"
description = "A JSON API with a database: FastAPI and Postgres on a Tiffin box."
requires-python = ">=3.14"
dependencies = [
    "fastapi[opentelemetry]==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.3",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "httpx==0.28.1", # GET /me asks the box's sign-in service; imported only when sign-in is on
]

[dependency-groups]
dev = ["pytest==9.1.1", "asgi-lifespan==2.1.0"]

# Where FastAPI's CLI and the box find the app.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

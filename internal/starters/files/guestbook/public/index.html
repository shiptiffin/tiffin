<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- analytics -->
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Guestbook</p>
      <h1>Sign the book</h1>
      <p class="lede" id="greeting">Leave a note. It goes into Postgres on this box.</p>
    </header>
    <form id="form" autocomplete="off">
      <label>Name <input name="name" maxlength="60" required placeholder="Ada"></label>
      <label>Note <textarea name="message" maxlength="280" required rows="3" placeholder="Hello from my laptop"></textarea></label>
      <button type="submit">Sign</button>
      <p class="status" id="status" role="status"></p>
    </form>
    <ol id="entries" class="entries" aria-live="polite"></ol>
    <footer><span id="visits"></span> · one box: Hono, Postgres, Valkey and analytics</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
